# Copy these values into backend/application-local.properties for local development.
# Keep that file untracked. Use Razorpay Test Mode credentials only during development.
razorpay.key.id=rzp_test_your_key_id
razorpay.key.secret=your_test_key_secret

# Optional initial local administrator account. Keep real values only in
# application-local.properties, never in this example file or Git.
app.bootstrap-admin.email=admin@example.com
app.bootstrap-admin.password=choose-a-strong-local-password
